{% extends "base_mobile.html" %}
{% block title %}RUÍDO — Aguardando{% endblock %}

{% block content %}
<div class="waiting-screen">
  <div class="waiting-card">
    <div class="tv-icon tv-icon--lg">
      <div class="tv-screen"></div>
      <div class="tv-stand"></div>
    </div>
    <p class="waiting-title-mobile">AGUARDE OS JOGADORES</p>
    <p class="waiting-sub-mobile">Acompanhe a televisão para continuar a experiência.</p>
    <div class="waiting-dots"><span></span><span></span><span></span></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const socket = io();
  socket.emit("join_room");
  // LOBBY ausente de propósito: aguardando no lobby o jogador PERMANECE aqui
  // (evita o loop /waiting → /join → /waiting). Reset é tratado por session_ended.
  const REDIRECT = {
    "ROUND_1": "/round/1", "ROUND_2": "/round/2", "ROUND_3": "/round/3",
    "SHOW_1": "/results", "SHOW_2": "/results", "FINAL": "/results",
  };
  socket.on("state_change", function (data) {
    const dest = REDIRECT[data.state];
    if (dest && dest !== location.pathname) window.location.href = dest;  // sem self-reload
  });
  socket.on("session_ended", function () { window.location.href = "/join"; });
</script>
{% endblock %}
