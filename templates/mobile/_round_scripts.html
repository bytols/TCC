{# Shared scripts for rounds 1/2/3 — loaded in extra_js (after socket.io). #}
<script src="/static/js/round.js"></script>
<script>
  const _sock = io();
  _sock.emit("join_room");
  // Destino derivado do estado (rodadas indefinidas: ROUND_n → /round/n).
  function _destFor(s) {
    if (s === "LOBBY") return "/join";
    if (s.indexOf("ROUND_") === 0) return "/round/" + s.split("_")[1];
    if (s.indexOf("SHOW_") === 0 || s === "FINAL") return "/results";
    return null;
  }
  _sock.on("state_change", function (d) {
    const dest = _destFor(d.state);
    if (dest && location.pathname !== dest) location.href = dest;
  });
  _sock.on("session_ended", function () { location.href = "/join"; });
</script>
